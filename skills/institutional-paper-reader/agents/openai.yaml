interface:
  display_name: "Institutional Paper Reader"
  short_description: "Map, access, compare, and preserve key papers"
  default_prompt: "Use $institutional-paper-reader to research this topic, expand important citation networks when coverage matters, build a source-anchored evidence matrix for material papers, use my configured university access only when required, and save material papers to Zotero when authorised."

policy:
  allow_implicit_invocation: true
